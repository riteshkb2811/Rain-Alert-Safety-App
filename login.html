<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Rain Alert App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      /* Linear gradient background */
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.9); /* slightly transparent to show gradient */
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h3 {
      color: #333;
    }

    .btn-primary {
      background-color: #3a7bd5;
      border-color: #3a7bd5;
    }

    .btn-primary:hover {
      background-color: #00d2ff;
      border-color: #00d2ff;
    }
  </style>
</head>
<body>

  <div class="card shadow-lg p-4">
    <h3 class="text-center mb-4">🌧 Rain Alert - Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="button" class="btn btn-primary w-100" onclick="location.href='dashboard.html'">Login</button>
    </form>
    <p id="msg" class="mt-3 text-center"></p>
    <p class="text-center mt-2">New user? <a href="register.html">Register</a> | <a href="homepage.html">Home</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
