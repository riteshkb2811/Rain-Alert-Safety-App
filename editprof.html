<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Alert | Edit Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .edit-profile-card {
      max-width: 600px;
      margin: 50px auto;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">🌧 Rain Alert</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="community.html">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="emergency.html">Emergency</a></li>
        <li class="nav-item"><a class="nav-link text-danger" href="login.html">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Edit Profile Form -->
<div class="container">
  <div class="card edit-profile-card shadow border-0">
    <div class="card-body text-center">
      <img src="https://avatar.iran.liara.run/public/36" alt="User Avatar" class="profile-avatar mb-3">
      <h3 class="fw-bold mb-4">Edit Profile</h3>

      <form>
        <div class="mb-3 text-start">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" value="Atharva Ghaware">
        </div>

        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" value="atharva@example.com">
        </div>

        <div class="mb-3 text-start">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" class="form-control" id="phone" value="+91 7721 811140">
        </div>

        <div class="mb-3 text-start">
          <label for="location" class="form-label">Location</label>
          <input type="text" class="form-control" id="location" value="Pune, India">
        </div>

        <div class="mb-3 text-start">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter new password">
        </div>

        <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
        <a href="profile.html" class="btn btn-secondary mt-3 ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2025 Rain Alert. Edit Profile</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
